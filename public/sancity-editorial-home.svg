    <ellipse cx="1390" cy="380" rx="90" ry="62" fill="#6e8065"/>
    <ellipse cx="1450" cy="430" rx="70" ry="52" fill="#78896e"/>
    <ellipse cx="1335" cy="450" rx="62" ry="48" fill="#687b5f"/>
