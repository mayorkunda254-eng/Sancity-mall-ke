<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Modern Sancity home interior</title>
  <desc id="desc">Stylized warm modern living room used as an editorial hero placeholder until real Sancity lifestyle photography is supplied.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d0c4"/>
      <stop offset="1" stop-color="#c8b9a8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e8a74"/>
      <stop offset="1" stop-color="#b9a48e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#31261d" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="650" width="1600" height="250" fill="url(#floor)"/>

  <rect x="1010" y="90" width="390" height="420" rx="3" fill="#eee9e2" opacity=".72"/>
  <rect x="1040" y="120" width="330" height="360" fill="#f8f5f0"/>
  <rect x="1060" y="140" width="290" height="320" fill="#b55236"/>
  <path d="M1085 415 C1160 300 1230 270 1335 180" fill="none" stroke="#f1d4c8" stroke-width="30" stroke-linecap="round"/>
  <circle cx="1270" cy="220" r="60" fill="#221f1c" opacity=".86"/>

  <g filter="url(#shadow)">
    <rect x="475" y="495" width="650" height="210" rx="42" fill="#d9c7b4"/>
    <rect x="525" y="440" width="550" height="140" rx="38" fill="#e3d3c2"/>
    <rect x="490" y="470" width="90" height="190" rx="34" fill="#d3bfaa"/>
    <rect x="1020" y="470" width="90" height="190" rx="34" fill="#d3bfaa"/>
    <rect x="600" y="500" width="210" height="145" rx="24" fill="#c8ae99"/>
    <rect x="830" y="500" width="210" height="145" rx="24" fill="#dbc7b5"/>
  </g>

  <rect x="290" y="350" width="14" height="345" fill="#2e2a26"/>
  <path d="M225 340 H368 L334 410 H260 Z" fill="#2e2a26"/>
  <circle cx="296" cy="710" r="46" fill="#2e2a26"/>

  <ellipse cx="1170" cy="760" rx="190" ry="54" fill="#7e6b58" opacity=".36"/>
  <ellipse cx="1170" cy="690" rx="145" ry="42" fill="#694f3f"/>
  <rect x="1158" y="690" width="24" height="125" fill="#5a4639"/>

  <rect x="125" y="175" width="270" height="310" fill="#eee9e1"/>
  <rect x="150" y="200" width="220" height="260" fill="#b9afa4"/>
  <circle cx="260" cy="300" r="75" fill="#8d4a37"/>
  <rect x="195" y="395" width="130" height="18" rx="9" fill="#211e1b"/>

