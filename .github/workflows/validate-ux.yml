name: Validate UX build

on:
  push:
    branches:
      - ux/mobile-whatsapp-tap-targets

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-whatsapp-tap-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify storefront prerender survived UX changes
        run: |
          grep -q "Everything for a Better Home" dist/index.html
          grep -q "Chat with Sancity Mall on WhatsApp" dist/index.html
          test -f dist/admin/index.html
