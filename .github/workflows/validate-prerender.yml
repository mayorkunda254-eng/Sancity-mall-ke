name: Validate prerender architecture

on:
  push:
    branches:
      - architecture/prerender-storefront

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/prerender-storefront
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify prerendered storefront
        run: |
          grep -q "Everything for a Better Home" dist/index.html
          grep -q "SANCITY" dist/index.html
          test -f dist/admin/index.html
          if grep -q "Everything for a Better Home" dist/admin/index.html; then
            echo "Admin shell must not contain prerendered storefront markup"
            exit 1
          fi
          echo "Storefront prerender and CSR admin shell verified"
